<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OTP Verification - Online Voting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>OTP Verification</h2>
    <p id="displayOtp">Generating OTP…</p>
    <form id="otpForm">
      <input type="text" id="otpInput" placeholder="Enter 4‑digit OTP" required pattern="\d{4}"><br>
      <button type="submit">Verify OTP</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
